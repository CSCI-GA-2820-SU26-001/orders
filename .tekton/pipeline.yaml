apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: git-url
      description: The URL of the repo to clone
    - name: git-revision
      description: The branch or ref to check out
      default: master
    - name: image-name
      description: The fully qualified name of the image to build and deploy
      default: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/orders:latest
    - name: manifest-dir
      description: The directory containing k8s manifests
      default: "k8s"
    - name: base-url
      description: Base URL of the deployed service for the BDD task
      default: http://orders:8080

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: lint
      runAfter:
        - clone
      taskRef:
        name: pylint
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      runAfter:
        - clone
      taskRef:
        name: pytest-env
      params:
        - name: secret-name
          value: postgres-creds
        - name: secret-key
          value: database_uri
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build
      runAfter:
        - lint
        - test
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      params:
        - name: IMAGE
          value: $(params.image-name)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: deploy
      runAfter:
        - build
      taskRef:
        name: deploy-image
      params:
        - name: image-name
          value: $(params.image-name)
        - name: manifest-dir
          value: $(params.manifest-dir)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: bdd
      runAfter:
        - deploy
      taskRef:
        name: behave
      params:
        - name: base-url
          value: $(params.base-url)
      workspaces:
        - name: source
          workspace: shared-workspace
