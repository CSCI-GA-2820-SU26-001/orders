apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: orders-pipeline
spec:
  params:
    - name: git-url
      description: The URL of the repo to clone
    - name: git-revision
      description: The branch or ref to check out
      default: master
    - name: base-url
      description: Base URL of the deployed service for the BDD task
      default: http://orders:8080
    - name: image-registry
      description: Registry and namespace where the image will be pushed
      default: image-registry.openshift-image-registry.svc:5000/orders
    - name: image-name
      description: Name of the container image to build
      default: orders
    - name: image-tag
      description: Tag to apply to the built image
      default: latest

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: lint
      runAfter:
        - clone
      taskRef:
        name: lint-task
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      runAfter:
        - clone
      taskRef:
        name: test-task
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build
      runAfter:
        - lint
        - test
      taskRef:
        name: build-task
      params:
        - name: image
          value: $(params.image-registry)/$(params.image-name):$(params.image-tag)
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: deploy
      runAfter:
        - build
      taskRef:
        name: deploy-task

    - name: bdd
      runAfter:
        - deploy
      taskRef:
        name: bdd-task
      params:
        - name: base-url
          value: $(params.base-url)
      workspaces:
        - name: source
          workspace: shared-workspace
